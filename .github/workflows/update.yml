name: تحديث الأخبار

on:
  schedule:
    - cron: "0 */3 * * *"   # كل 3 ساعات؛ غيّره إلى "0 5 * * *" للتحديث مرة يومياً
  workflow_dispatch:         # تشغيل يدوي من تبويب Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python fetch_news.py
      - name: حفظ news.json
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add docs/news.json
          git diff --staged --quiet || (git commit -m "تحديث الأخبار" && git push)

