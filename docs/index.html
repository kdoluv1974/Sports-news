<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صافرة — أخبار الرياضة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#12202B; --paper:#F4F6F7; --surface:#FFFFFF;
  --teal:#0E7C7B; --signal:#F0A202; --line:#D5DCE0; --muted:#586976;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-padding-top:72px}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.75;font-size:16px}
a{color:inherit;text-decoration:none}
a:hover .t{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-color:var(--teal)}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:62rem;margin:0 auto;padding:0 1.25rem}

/* الترويسة */
.mast{padding:2rem 0 1.25rem;display:flex;align-items:baseline;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.brand{font-family:var(--display);font-weight:800;font-size:clamp(2.6rem,8vw,4.2rem);line-height:1.1;margin:0;letter-spacing:-.01em}
.brand i{font-style:normal;color:var(--teal)}
.tag{margin:.25rem 0 0;color:var(--muted);font-size:.95rem}
.stamp{color:var(--muted);font-size:.9rem}

/* شريط التصفية */
.bar{position:sticky;top:0;z-index:5;background:var(--paper);border-block:1px solid var(--line)}
.bar .wrap{display:flex;gap:1rem;align-items:center;flex-wrap:wrap;padding-block:.6rem}
.tabs{display:flex;gap:1.1rem;overflow-x:auto;scrollbar-width:none;flex:1 1 100%}
.tabs::-webkit-scrollbar{display:none}
.tabs button{all:unset;cursor:pointer;white-space:nowrap;padding:.35rem 0;font-weight:500;color:var(--muted);border-bottom:3px solid transparent}
.tabs button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.tabs button[aria-pressed="true"]{color:var(--ink);border-color:var(--teal);font-weight:600}
.tabs small{color:var(--muted);font-weight:400;margin-inline-start:.3rem}
.tools{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;flex:1 1 100%}
.tools input[type=search],.tools select{font:inherit;font-size:.92rem;padding:.4rem .7rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink)}
.tools input[type=search]{flex:1 1 12rem;min-width:0}
.tools label{display:flex;gap:.4rem;align-items:center;font-size:.92rem;color:var(--muted);cursor:pointer}

/* الخبر الرئيسي */
.lead{display:grid;grid-template-columns:1.25fr 1fr;gap:1.75rem;align-items:center;padding:2rem 0;border-bottom:1px solid var(--line)}
.lead img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:4px;display:block;background:var(--line)}
.lead h2{font-family:var(--display);font-weight:800;font-size:clamp(1.5rem,3.4vw,2.15rem);line-height:1.5;margin:0 0 .6rem}
.lead p{margin:.5rem 0 0;color:var(--muted)}
.lead.noimg{grid-template-columns:1fr}

/* قائمة الأخبار */
.day{font-family:var(--display);font-weight:600;font-size:1.05rem;margin:2rem 0 0;padding-bottom:.5rem;border-bottom:2px solid var(--ink)}
.row{display:grid;grid-template-columns:3.6rem 1fr auto;gap:1rem;padding:1rem 0;border-bottom:1px solid var(--line);align-items:start}
.time{color:var(--muted);font-size:.9rem;font-variant-numeric:tabular-nums;padding-top:.15rem}
.row h3{margin:0;font-size:1.08rem;font-weight:600;line-height:1.65}
.orig{margin:.15rem 0 0;color:var(--muted);font-size:.88rem;direction:ltr;text-align:left}
.meta{margin:.2rem 0 0;font-size:.88rem;color:var(--muted)}
.meta .new{display:inline-block;width:.55rem;height:.55rem;border-radius:50%;background:var(--signal);margin-inline-end:.4rem}
.meta .mt{display:inline-block;margin-inline-start:.6rem;padding-inline-start:.6rem;border-inline-start:1px solid var(--line)}
.thumb{width:6.5rem;aspect-ratio:4/3;object-fit:cover;border-radius:4px;background:var(--line)}
.empty,.err{padding:3rem 0;color:var(--muted)}
.err{color:#9B2C2C}
footer{margin:3rem 0 2.5rem;padding-top:1rem;border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}

@media (max-width:640px){
  .lead{grid-template-columns:1fr;gap:1rem}
  .row{grid-template-columns:1fr auto}
  .time{grid-column:1/-1;padding:0}
  .thumb{width:5rem}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div>
      <h1 class="brand">صافرة<i>.</i></h1>
      <p class="tag">أخبار الرياضة من مصادر عربية وعالمية، تُحدَّث يومياً</p>
    </div>
    <div class="stamp" id="stamp"></div>
  </header>
</div>

<div class="bar">
  <div class="wrap">
    <div class="tabs" id="tabs" role="group" aria-label="الرياضة"></div>
    <div class="tools">
      <input type="search" id="q" placeholder="ابحث في العناوين" aria-label="ابحث في العناوين">
      <select id="src" aria-label="المصدر"><option value="">كل المصادر</option></select>
      <label><input type="checkbox" id="orig"> إظهار العنوان الأصلي</label>
    </div>
  </div>
</div>

<main class="wrap" id="main" aria-live="polite"></main>

<div class="wrap">
  <footer>العناوين غير العربية مترجمة آلياً وقد لا تكون دقيقة تماماً. كل خبر يفتح في موقع مصدره.</footer>
</div>

<script>
const state = { items: [], sport: 'الكل', source: '', q: '', orig: false };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u) ? u : '';
const fmtTime = d => d.toLocaleTimeString('ar-KW-u-nu-latn', { hour: '2-digit', minute: '2-digit', hour12: false });
const sameDay = (a, b) => a.toDateString() === b.toDateString();

function dayLabel(d) {
  const now = new Date(), yest = new Date(now - 864e5);
  if (sameDay(d, now)) return 'اليوم';
  if (sameDay(d, yest)) return 'أمس';
  return d.toLocaleDateString('ar-KW-u-nu-latn', { weekday: 'long', day: 'numeric', month: 'long' });
}

function filtered() {
  const q = state.q.trim().toLowerCase();
  return state.items.filter(i =>
    (state.sport === 'الكل' || i.sport === state.sport) &&
    (!state.source || i.source === state.source) &&
    (!q || (i.title_ar || '').toLowerCase().includes(q) || i.title.toLowerCase().includes(q))
  );
}

function renderTabs() {
  const counts = {};
  state.items.forEach(i => counts[i.sport] = (counts[i.sport] || 0) + 1);
  const names = ['الكل', ...Object.keys(counts).sort((a, b) => counts[b] - counts[a])];
  $('tabs').innerHTML = names.map(n =>
    `<button type="button" data-s="${esc(n)}" aria-pressed="${n === state.sport}">${esc(n)}<small>${n === 'الكل' ? state.items.length : counts[n]}</small></button>`
  ).join('');
}

function render() {
  const list = filtered();
  const main = $('main');
  if (!list.length) { main.innerHTML = '<p class="empty">لا توجد أخبار مطابقة. جرّب تغيير الرياضة أو المصدر.</p>'; return; }

  const leadIdx = Math.max(0, list.slice(0, 12).findIndex(i => i.image));
  const lead = list[leadIdx];
  const rest = list.filter((_, k) => k !== leadIdx);
  const img = safeUrl(lead.image);

  let out = `<a class="lead${img ? '' : ' noimg'}" href="${esc(safeUrl(lead.link))}" target="_blank" rel="noopener noreferrer">
    ${img ? `<img src="${esc(img)}" alt="" onerror="this.remove()">` : ''}
    <div>
      <h2 class="t">${esc(lead.title_ar || lead.title)}</h2>
      ${lead.summary_ar || lead.summary ? `<p>${esc(lead.summary_ar || lead.summary)}</p>` : ''}
      <p class="meta">${esc(lead.source)}<span class="mt">${esc(lead.sport)}</span></p>
    </div></a>`;

  let lastDay = '';
  const now = Date.now();
  for (const i of rest) {
    const d = new Date(i.published);
    const label = dayLabel(d);
    if (label !== lastDay) { out += `<h2 class="day">${esc(label)}</h2>`; lastDay = label; }
    const fresh = now - d < 3 * 36e5;
    const thumb = safeUrl(i.image);
    out += `<a class="row" href="${esc(safeUrl(i.link))}" target="_blank" rel="noopener noreferrer">
      <span class="time">${fmtTime(d)}</span>
      <div>
        <h3 class="t">${esc(i.title_ar || i.title)}</h3>
        ${state.orig && i.lang !== 'ar' ? `<p class="orig">${esc(i.title)}</p>` : ''}
        <p class="meta">${fresh ? '<span class="new" title="خبر جديد"></span>' : ''}${esc(i.source)}<span class="mt">${esc(i.sport)}</span></p>
      </div>
      ${thumb ? `<img class="thumb" src="${esc(thumb)}" alt="" loading="lazy" onerror="this.remove()">` : '<span></span>'}
    </a>`;
  }
  main.innerHTML = out;
}

async function init() {
  try {
    const res = await fetch('news.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    state.items = data.items || [];
    const u = new Date(data.updated);
    $('stamp').textContent = 'آخر تحديث: ' + dayLabel(u) + '، ' + fmtTime(u);
  } catch (e) {
    $('main').innerHTML = '<p class="err">تعذّر تحميل الأخبار. افتح الصفحة عبر خادم (مثل GitHub Pages أو python -m http.server) وليس كملف مباشر.</p>';
    return;
  }
  [...new Set(state.items.map(i => i.source))].sort().forEach(s => {
    const o = document.createElement('option'); o.value = o.textContent = s; $('src').appendChild(o);
  });
  renderTabs(); render();
}

$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.sport = b.dataset.s; renderTabs(); render();
});
$('src').addEventListener('change', e => { state.source = e.target.value; render(); });
$('q').addEventListener('input', e => { state.q = e.target.value; render(); });
$('orig').addEventListener('change', e => { state.orig = e.target.checked; render(); });
init();
</script>
</body>
</html>
