<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بلا حدود — أخبار العالم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&family=Noto+Kufi+Arabic:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --night:#0B1220; --night2:#16213A; --paper:#EEF1F0; --surface:#FFFFFF;
  --ink:#10192B; --muted:#5A6778; --line:#D9DFDD; --hot:#FF5A1F; --pitch:#0E9F6E;
  --body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,Arial,sans-serif;
  --display:"Noto Kufi Arabic","IBM Plex Sans Arabic",Tahoma,Arial,sans-serif;
}
html[lang="en"]{
  --body:"Inter","Segoe UI",Arial,sans-serif;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);line-height:1.7;font-size:16px}
a{color:inherit;text-decoration:none}
button{font:inherit}
[hidden]{display:none!important}
a:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.wrap{max-width:76rem;margin:0 auto;padding:0 1.25rem}

/* ===== الترويسة ===== */
.top{background:var(--night);color:#fff;position:sticky;top:0;z-index:10;border-bottom:3px solid var(--hot)}
.topin{display:flex;align-items:center;gap:1.5rem;min-height:4rem}
.brandbox{flex:none;padding:.55rem 0}
.brand{font-family:var(--display);font-weight:800;font-size:1.9rem;line-height:1;margin:0}
html[lang="en"] .brand{font-size:2.3rem;letter-spacing:.01em}
.brand i{font-style:normal;color:var(--hot)}
.role{margin:.3rem 0 0;font-size:.78rem;color:#9AA7BF;line-height:1.3}
#tabs{display:flex;gap:.25rem;overflow-x:auto;scrollbar-width:none;flex:1}
#tabs::-webkit-scrollbar{display:none}
#tabs button{all:unset;cursor:pointer;white-space:nowrap;padding:1.25rem .85rem;color:#B6C0D3;font-weight:500;border-bottom:4px solid transparent;margin-bottom:-3px}
#tabs button:hover{color:#fff}
#tabs button[aria-pressed="true"]{color:#fff;font-weight:600;border-bottom-color:var(--c,#fff)}
#tabs button:focus-visible{outline:3px solid var(--hot);outline-offset:-3px}
#tabs small{color:#8391AB;margin-inline-start:.35rem;font-weight:400}
.stamp{flex:none;color:#8391AB;font-size:.85rem}
#langs{flex:none;display:flex;border:1px solid #33425F;border-radius:6px;overflow:hidden}
#langs button{cursor:pointer;border:0;background:transparent;color:#B6C0D3;padding:.25rem .8rem;font-size:.9rem;font-weight:500}
#langs button:hover{color:#fff}
#langs button[aria-pressed="true"]{background:#fff;color:var(--night);font-weight:600}

/* ===== تصنيف الدول ===== */
.cstrip{background:var(--night2);color:#fff}
.cstrip .wrap{display:flex;align-items:center;gap:1rem;padding-block:.6rem}
.clabel{flex:none;color:#8391AB;font-size:.88rem}
#chips{display:flex;gap:.45rem;overflow-x:auto;scrollbar-width:none;padding-block:2px}
#chips::-webkit-scrollbar{display:none}
#chips button{flex:none;cursor:pointer;border:1px solid #33425F;background:transparent;color:#D5DCEA;border-radius:999px;padding:.15rem .9rem;font-size:.9rem}
#chips button:hover{border-color:#8391AB}
#chips button[aria-pressed="true"]{background:#fff;color:var(--night);border-color:#fff;font-weight:600}
#chips small{margin-inline-start:.35rem;opacity:.65}

/* ===== شريط الأدوات ===== */
.tools{background:var(--surface);border-bottom:1px solid var(--line)}
.tools .wrap{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap;padding-block:.65rem}
.tools input[type=search],.tools select{font:inherit;font-size:.92rem;padding:.45rem .8rem;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
.tools input[type=search]{flex:1 1 14rem;min-width:0}
.tools label{display:flex;gap:.4rem;align-items:center;font-size:.92rem;color:var(--muted);cursor:pointer}

/* ===== الوسائط (صورة أو لون الرياضة) ===== */
.media{position:relative;overflow:hidden;background:linear-gradient(135deg,var(--c),var(--night) 135%)}
.media .phn{position:absolute;inset-inline-start:.9rem;bottom:.4rem;font-family:var(--display);font-weight:800;font-size:2.2rem;color:rgba(255,255,255,.2);line-height:1.3}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .5s}

/* ===== الأخبار الرئيسية ===== */
.hero{display:grid;grid-template-columns:2fr 1fr 1fr;grid-template-rows:repeat(2,minmax(11rem,1fr));gap:.25rem;height:32rem;margin-top:1.25rem}
.tile{position:relative;display:block;overflow:hidden;color:#fff;min-height:11rem}
.tile.big{grid-row:1/3}
.tile .media{position:absolute;inset:0}
.shade{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,12,22,.94) 0%,rgba(8,12,22,.4) 55%,rgba(8,12,22,0) 100%)}
.tx{position:absolute;inset-inline:0;bottom:0;padding:1.1rem 1.25rem}
.chip{display:inline-block;background:var(--c);color:#fff;font-size:.8rem;font-weight:600;padding:.05rem .6rem;border-radius:3px;margin-bottom:.4rem}
.tile h2{font-family:var(--display);font-weight:800;font-size:1.02rem;line-height:1.6;margin:0}
.tile.big h2{font-size:clamp(1.45rem,2.7vw,2.1rem);line-height:1.55}
html[lang="en"] .tile h2{font-size:1.3rem;line-height:1.25}
html[lang="en"] .tile.big h2{font-size:clamp(1.9rem,3.4vw,2.8rem);line-height:1.15}
.tile:hover img,.card:hover img{transform:scale(1.04)}
.tile:hover h2,.card:hover h3{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}

/* ===== شبكة الأخبار ===== */
.sec{font-family:var(--display);font-weight:800;font-size:1.3rem;margin:2.25rem 0 1rem;display:flex;align-items:center;gap:.7rem}
html[lang="en"] .sec{font-size:1.7rem}
.sec::before{content:"";width:.5rem;height:1.5rem;background:var(--hot);border-radius:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(17rem,1fr));gap:1.25rem}
.card{display:flex;flex-direction:column;background:var(--surface);border-radius:6px;overflow:hidden;border-bottom:4px solid var(--c)}
.card .media{aspect-ratio:16/9}
.card .new{position:absolute;inset-block-start:.6rem;inset-inline-start:.6rem;z-index:1;background:var(--hot);color:#fff;font-size:.78rem;font-weight:600;padding:0 .55rem;border-radius:3px}
.cb{padding:.85rem 1rem 1rem;display:flex;flex-direction:column;gap:.3rem;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:.3rem .6rem;align-items:center}
.cty{font-size:.8rem;color:var(--muted);background:var(--paper);padding:0 .55rem;border-radius:3px}
.tag{font-size:.85rem;font-weight:600;color:var(--c);filter:brightness(.78)}
.card h3{margin:0;font-family:var(--display);font-weight:600;font-size:1.02rem;line-height:1.7}
html[lang="en"] .card h3{font-size:1.22rem;line-height:1.3;font-weight:600}
.orig{margin:0;color:var(--muted);font-size:.85rem;text-align:start;line-height:1.5}
.meta{margin:auto 0 0;padding-top:.4rem;font-size:.85rem;color:var(--muted);display:flex;flex-wrap:wrap}
.meta .mt{margin-inline-start:.6rem;padding-inline-start:.6rem;border-inline-start:1px solid var(--line)}
.tile .meta{color:#C9D2E2;padding-top:.3rem}
.tile .meta .mt{border-color:rgba(255,255,255,.3)}
.more{display:block;margin:2rem auto 0;background:var(--night);color:#fff;border:0;border-radius:6px;padding:.7rem 2.2rem;font-weight:600;cursor:pointer}
.more:hover{background:var(--night2)}
.empty,.err{padding:3rem 0;color:var(--muted)}
.err{color:#B42318}
footer{background:var(--night);color:#8391AB;margin-top:3.5rem;padding:1.5rem 0;font-size:.88rem}

@media (max-width:760px){
  .topin{gap:.75rem;flex-wrap:wrap;padding-block:.4rem}
  .brandbox{order:1}#langs{order:2;margin-inline-start:auto}#tabs{order:3;flex:1 1 100%}.stamp{display:none}
  #tabs button{padding:.6rem .8rem}
  .hero{grid-template-columns:1fr 1fr;grid-template-rows:none;height:auto}
  .tile{min-height:12rem}
  .tile.big{grid-column:1/-1;grid-row:auto;min-height:19rem}
}
@media (prefers-reduced-motion:reduce){.media img{transition:none}.tile:hover img,.card:hover img{transform:none}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap topin">
    <div class="brandbox"><h1 class="brand"><span data-i18n="brand">بلا حدود</span><i>.</i></h1><p class="role" data-i18n="role"></p></div>
    <nav id="tabs" role="group"></nav>
    <div class="stamp" id="stamp"></div>
    <div id="langs" role="group" aria-label="Language / اللغة">
      <button type="button" data-l="ar" lang="ar">عربي</button>
      <button type="button" data-l="en" lang="en">EN</button>
    </div>
  </div>
</header>

<div class="cstrip" id="cstrip" hidden>
  <div class="wrap"><span class="clabel" data-i18n="country"></span><div id="chips" role="group"></div></div>
</div>

<div class="tools">
  <div class="wrap">
    <input type="search" id="q">
    <select id="src"><option value=""></option></select>
    <label><input type="checkbox" id="orig"> <span data-i18n="showOrig"></span></label>
  </div>
</div>

<main class="wrap" id="main" aria-live="polite"></main>

<footer>
  <div class="wrap" data-i18n="footer"></div>
</footer>

<script>
const PAGE = 24;
const CAT_ORDER = ['سياسة','اقتصاد','رياضة','تقنية','علوم وصحة','ثقافة وفنون'];
const COLORS = {'سياسة':'#C8102E','اقتصاد':'#0E9F6E','رياضة':'#F26B1D','تقنية':'#2F6FED','علوم وصحة':'#0A9DB0','ثقافة وفنون':'#8B3FD0'};
const CAT_EN = {'سياسة':'Politics','اقتصاد':'Economy','رياضة':'Sports','تقنية':'Technology','علوم وصحة':'Science & Health','ثقافة وفنون':'Culture & Arts'};
const SPORT_EN = {'كرة القدم':'Football','كرة السلة':'Basketball','التنس':'Tennis','سباقات':'Motorsport','القتال':'Combat sports','رياضات أخرى':'Other sports'};
const T = {
  ar: { dir:'rtl', locale:'ar-KW-u-nu-latn', title:'بلا حدود — أخبار العالم', brand:'بلا حدود',
    role:'رئيس مجلس الإدارة: خالد محمد الشربيني', country:'الدولة', sport:'القسم', source:'المصدر',
    all:'الكل', allCountries:'كل الدول', allSources:'كل المصادر', search:'ابحث في العناوين',
    showOrig:'إظهار العنوان الأصلي', latest:'آخر الأخبار', more:'عرض المزيد', fresh:'جديد', updated:'آخر تحديث: ',
    empty:'لا توجد أخبار مطابقة. جرّب تغيير القسم أو الدولة أو المصدر.',
    error:'تعذّر تحميل الأخبار. افتح الصفحة عبر خادم (مثل GitHub Pages أو python -m http.server) وليس كملف مباشر.',
    footer:'أخبار العالم من مصادر عربية وعالمية. العناوين المترجمة آلياً قد لا تكون دقيقة تماماً، وكل خبر يفتح في موقع مصدره.' },
  en: { dir:'ltr', locale:'en', title:'Borderless — World News', brand:'Borderless',
    role:'Chairman of the Board: Khaled Mohamed El-Sherbiny', country:'Country', sport:'Section', source:'Source',
    all:'All', allCountries:'All countries', allSources:'All sources', search:'Search headlines',
    showOrig:'Show original headline', latest:'Latest news', more:'Load more', fresh:'New', updated:'Updated ',
    empty:'No matching news. Try a different section, country or source.',
    error:'Could not load the news. Open the page through a web server (such as GitHub Pages or python -m http.server), not as a local file.',
    footer:'World news from Arab and international sources. Machine-translated headlines may be imprecise. Each story opens on its source site.' }
};

let lang = 'ar';
try { const s = localStorage.getItem('lang'); if (s === 'en' || s === 'ar') lang = s; } catch (e) {}

const state = { items: [], countryNames: {}, updated: null, cat: 'الكل', country: 'الكل', source: '', q: '', orig: false, shown: PAGE };
const $ = id => document.getElementById(id);
const t = k => T[lang][k];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u) ? u : '';
const col = s => COLORS[s] || '#44566F';
const catOf = i => i.category || 'رياضة';          // بيانات قديمة كانت للرياضة فقط
const subOf = i => i.category ? (i.sub || '') : (i.sport || '');
const catName = c => lang === 'ar' ? c : (CAT_EN[c] || c);
const sname = s => lang === 'ar' ? s : (SPORT_EN[s] || s);
const cname = c => lang === 'ar' ? c : (state.countryNames[c] || c);
const ttl = i => lang === 'ar' ? (i.title_ar || i.title) : (i.title_en || i.title);
const rtfs = {};
const rtf = () => rtfs[lang] || (rtfs[lang] = new Intl.RelativeTimeFormat(t('locale'), { numeric: 'auto' }));

function rel(date) {
  const m = Math.max(1, Math.round((Date.now() - date) / 6e4));
  if (m < 60) return rtf().format(-m, 'minute');
  const h = Math.round(m / 60);
  if (h < 24) return rtf().format(-h, 'hour');
  const d = Math.round(h / 24);
  if (d < 3) return rtf().format(-d, 'day');
  return date.toLocaleDateString(t('locale'), { day: 'numeric', month: 'long' });
}

function media(i) {
  const img = safeUrl(i.image);
  return `<div class="media" style="--c:${col(catOf(i))}"><span class="phn">${esc(catName(catOf(i)))}</span>${img ? `<img src="${esc(img)}" alt="" loading="lazy" onerror="this.remove()">` : ''}</div>`;
}
const meta = i => `<p class="meta"><span>${esc(i.source)}</span><span class="mt">${rel(new Date(i.published))}</span></p>`;
const origLine = i => state.orig && i.lang !== lang ? `<p class="orig" dir="${i.lang === 'ar' ? 'rtl' : 'ltr'}">${esc(i.title)}</p>` : '';

const tile = (i, cls) => `<a class="tile ${cls}" href="${esc(safeUrl(i.link))}" target="_blank" rel="noopener noreferrer">
  ${media(i)}<div class="shade"></div>
  <div class="tx"><span class="chip" style="--c:${col(catOf(i))}">${esc(catName(catOf(i)))}</span><h2>${esc(ttl(i))}</h2>${meta(i)}</div></a>`;

const card = i => {
  const fresh = Date.now() - new Date(i.published) < 3 * 36e5;
  return `<a class="card" style="--c:${col(catOf(i))}" href="${esc(safeUrl(i.link))}" target="_blank" rel="noopener noreferrer">
  <div style="position:relative">${fresh ? `<span class="new">${esc(t('fresh'))}</span>` : ''}${media(i)}</div>
  <div class="cb"><div class="tags"><span class="tag">${esc(catName(catOf(i)))}</span>${subOf(i) ? `<span class="cty">${esc(sname(subOf(i)))}</span>` : ''}${(i.countries || []).map(c => `<span class="cty">${esc(cname(c))}</span>`).join('')}</div><h3>${esc(ttl(i))}</h3>${origLine(i)}${meta(i)}</div></a>`;
};

function filtered() {
  const q = state.q.trim().toLowerCase();
  return state.items.filter(i =>
    (state.cat === 'الكل' || catOf(i) === state.cat) &&
    (state.country === 'الكل' || (i.countries || []).includes(state.country)) &&
    (!state.source || i.source === state.source) &&
    (!q || [i.title, i.title_ar, i.title_en].some(x => (x || '').toLowerCase().includes(q)))
  );
}

function renderTabs() {
  const counts = {};
  state.items.forEach(i => counts[catOf(i)] = (counts[catOf(i)] || 0) + 1);
  const names = ['الكل', ...CAT_ORDER.filter(c => counts[c]), ...Object.keys(counts).filter(c => !CAT_ORDER.includes(c))];
  $('tabs').innerHTML = names.map(n =>
    `<button type="button" data-s="${esc(n)}" style="--c:${n === 'الكل' ? '#fff' : col(n)}" aria-pressed="${n === state.cat}">${esc(n === 'الكل' ? t('all') : catName(n))}<small>${n === 'الكل' ? state.items.length : counts[n]}</small></button>`
  ).join('');
}

function renderChips() {
  const counts = {};
  state.items.forEach(i => (i.countries || []).forEach(c => counts[c] = (counts[c] || 0) + 1));
  const names = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
  $('cstrip').hidden = !names.length;
  $('chips').innerHTML = ['الكل', ...names].map(n =>
    `<button type="button" data-c="${esc(n)}" aria-pressed="${n === state.country}">${esc(n === 'الكل' ? t('allCountries') : cname(n))}<small>${n === 'الكل' ? state.items.length : counts[n]}</small></button>`
  ).join('');
}

function render() {
  const list = filtered();
  const main = $('main');
  if (!list.length) { main.innerHTML = `<p class="empty">${esc(t('empty'))}</p>`; return; }

  let hero = [], rest = list;
  if (list.length >= 5) {
    hero = list.slice(0, 25).filter(i => i.image).slice(0, 5);
    for (const i of list) { if (hero.length >= 5) break; if (!hero.includes(i)) hero.push(i); }
    rest = list.filter(i => !hero.includes(i));
  }

  let out = '';
  if (hero.length) out += `<section class="hero">${tile(hero[0], 'big')}${hero.slice(1).map(i => tile(i, '')).join('')}</section>`;
  if (rest.length) {
    out += `<h2 class="sec">${esc(t('latest'))}</h2><div class="grid">${rest.slice(0, state.shown).map(card).join('')}</div>`;
    if (rest.length > state.shown) out += `<button type="button" class="more" id="more">${esc(t('more'))}</button>`;
  }
  main.innerHTML = out;
}

function applyLang() {
  const L = T[lang];
  document.documentElement.lang = lang;
  document.documentElement.dir = L.dir;
  document.title = L.title;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = L[el.dataset.i18n]);
  $('q').placeholder = L.search;
  $('q').setAttribute('aria-label', L.search);
  $('src').setAttribute('aria-label', L.source);
  $('tabs').setAttribute('aria-label', L.sport);
  $('chips').setAttribute('aria-label', L.country);
  $('src').options[0].textContent = L.allSources;
  document.querySelectorAll('#langs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l === lang));
  if (state.updated) $('stamp').textContent = L.updated + rel(state.updated);
  renderTabs(); renderChips(); render();
}

function reset() { state.shown = PAGE; render(); }

async function init() {
  applyLang();
  try {
    const res = await fetch('news.json', { cache: 'no-cache' });
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    state.items = data.items || [];
    state.countryNames = data.country_names || {};
    state.updated = new Date(data.updated);
  } catch (e) {
    $('main').innerHTML = `<p class="err">${esc(t('error'))}</p>`;
    return;
  }
  [...new Set(state.items.map(i => i.source))].sort().forEach(s => {
    const o = document.createElement('option'); o.value = o.textContent = s; $('src').appendChild(o);
  });
  applyLang();
}

$('langs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.dataset.l === lang) return;
  lang = b.dataset.l;
  try { localStorage.setItem('lang', lang); } catch (err) {}
  state.shown = PAGE; applyLang();
});
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.cat = b.dataset.s; renderTabs(); reset();
});
$('chips').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  state.country = b.dataset.c; renderChips(); reset();
});
$('main').addEventListener('click', e => {
  if (e.target.id === 'more') { state.shown += PAGE; render(); }
});
$('src').addEventListener('change', e => { state.source = e.target.value; reset(); });
$('q').addEventListener('input', e => { state.q = e.target.value; reset(); });
$('orig').addEventListener('change', e => { state.orig = e.target.checked; render(); });
init();
</script>
</body>
</html>
